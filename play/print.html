<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>証拠品ファイル Case 0（印刷用）</title>
  <style>
    @page { size: A4; margin: 16mm 14mm; }
    :root { --ink: #111; --line: #888; --paper: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9e9e9; color: var(--ink);
      font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif; line-height: 1.8; font-size: 11pt; }
    .sheet { background: var(--paper); max-width: 210mm; margin: 12px auto; padding: 16mm 14mm; }
    .sheet + .sheet { page-break-before: always; break-before: page; }
    .stamp { display: inline-block; border: 2px solid #b00; color: #b00; padding: 0 8px; font-weight: 700; transform: rotate(-4deg); }
    h1 { font-size: 18pt; margin: 0 0 8px; } h2 { font-size: 14pt; border-bottom: 1px solid var(--line); margin: 0 0 10px; }
    .meta { font-family: sans-serif; font-size: 9pt; color: #444; }
    table { border-collapse: collapse; width: 100%; font-size: 10pt; margin: 6px 0; }
    th, td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
    th { background: #f0f0f0; }
    svg { width: 100%; height: auto; }
    svg text { font-size: 13px; fill: #111; font-family: sans-serif; }
    svg .area { fill: #fff; stroke: #333; stroke-width: 2; }
    svg .alley { fill: #e6e6e6; }
    svg .cam { fill: #333; } svg .door { fill: #fff; stroke: #333; stroke-width: 2; }
    .toolbar { text-align: center; padding: 12px; font-family: sans-serif; }
    @media print { body { background: none; } .sheet { margin: 0; padding: 0; max-width: none; } .toolbar { display: none; } }
  </style>
</head>
<body>
  <div class="toolbar"><button onclick="window.print()">印刷する</button></div>
  <div id="root"></div>
  <script src="data/case0.js"></script>
  <script src="js/map.js"></script>
  <script>
    (function () {
      const D = window.CASE0, root = document.getElementById("root");
      const el = (tag, text) => { const e = document.createElement(tag); if (text != null) e.textContent = text; return e; };
      function sheet(title, idLabel) {
        const s = el("section"); s.className = "sheet";
        const meta = el("p", `潮見警察署 刑事課　事件番号 潮見-2026-1013　資料 ${idLabel}`); meta.className = "meta";
        s.append(meta, el("h2", title)); root.append(s); return s;
      }
      // 表紙
      const cover = el("section"); cover.className = "sheet";
      const st = el("span", "捜査資料・持出注意"); st.className = "stamp";
      const [yy, mm, dd] = D.date.split("-").map(Number);
      const wd = "日月火水木金土"[new Date(Date.UTC(yy, mm - 1, dd)).getUTCDay()];
      cover.append(st, el("h1", D.title), el("p", `事件発生日：${yy}年${mm}月${dd}日（${wd}）`), el("p", D.subtitle));
      D.briefing.forEach((p) => cover.append(el("p", p)));
      cover.append(el("h2", "関係者一覧"));
      const t = el("table"); const head = el("tr");
      ["氏名", "よみ", "年齢", "立場"].forEach((c) => head.append(el("th", c))); t.append(head);
      Object.values(D.people).forEach((p) => { const r = el("tr"); [p.name, p.kana, p.age, p.role].forEach((c) => r.append(el("td", c))); t.append(r); });
      cover.append(t, el("p", "※ 防犯カメラ記録・通話記録・SNSなどは「捜査端末」で照会してください。"), el("p", D.disclaimer));
      root.append(cover);
      // 証拠品
      D.evidence.forEach((e) => {
        const s = sheet(`${e.id}　${e.title}`, e.id);
        if (e.type === "map") s.append(window.buildMapSvg());
        if (e.type === "table") {
          const tb = el("table"); const hr = el("tr"); e.columns.forEach((c) => hr.append(el("th", c))); tb.append(hr);
          e.rows.forEach((row) => { const r = el("tr"); row.forEach((c) => r.append(el("td", c))); tb.append(r); });
          s.append(tb);
        }
        if (e.body) { const ul = el("ul"); e.body.forEach((b) => ul.append(el("li", b))); s.append(ul); }
        if (e.note) s.append(el("p", "※ " + e.note));
      });
      document.documentElement.dataset.ready = "1";
    })();
  </script>
</body>
</html>
